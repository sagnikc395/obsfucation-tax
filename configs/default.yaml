# Global defaults
seed: 42
output_dir: "artifacts"
device: "auto"  # auto | cuda | mps | cpu
dtype: "float16"  # float32 | float16 | bfloat16
cache_dir: null  # HF cache dir override

logging:
  level: "INFO"
  log_file: "artifacts/run.log"

splits:
  train: 0.6
  validation: 0.2
  test: 0.2

generation:
  max_new_tokens: 256
  temperature: 0.0
  top_p: 1.0
  do_sample: false

activations:
  layers: [12, 16, 20]
  mode: "teacher_forced"  # teacher_forced | self_generated
  aggregation: "mean"  # mean | last | max
  batch_size: 4

probes:
  regularization: "l2"
  C: 1.0
  max_iter: 1000
  layer_selection: "validation"  # validation | fixed

monitors:
  ensemble_weights: [0.5, 0.5]  # [black_box, probe]

red_team:
  level: "r0"
  evasion_strength: 0.0
  optimization_budget: 100
  transfer_layer: 16

analysis:
  n_bootstrap: 1000
  audit_budgets: [0.01, 0.02, 0.05, 0.1]
