[project]
name = "obsfucation-tax"
version = "0.1.0"
description = "Measure obfuscation tax of activation probes under adaptive sandbagging attacks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "control-arena>=19.0.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.36.2",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.4.0",
    "torch>=2.13.0",
    "tqdm>=4.66.0",
    "transformers>=4.57.6",
]

[project.scripts]
obfuscation-tax = "obfuscation_tax.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obfuscation_tax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
