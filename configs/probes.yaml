probe:
  type: "linear"  # linear | mlp
  regularization: "l2"
  C: 1.0
  penalty: "l2"
  solver: "lbfgs"
  max_iter: 1000
  class_weight: "balanced"

  layers: [12, 16, 20]
  aggregation: "mean"  # mean | last | max
  normalize: true

  train_split: "train"
  val_split: "validation"
  test_split: "test"

  selection_metric: "auroc"  # auroc | accuracy
  layer_selection: "validation"

  calibration: false

metrics:
  - "auroc"
  - "accuracy"
  - "auprc"
  - "ece"
